apiVersion: v1
kind: Pod
metadata:
  name: routed-carrier-workload
spec:
  resourceClaims:
    - name: endpoint
      resourceClaimName: routed-carrier-endpoint
  containers:
    - name: workload
      image: registry.k8s.io/pause:3.10
      resources:
        claims:
          - {name: endpoint, request: endpoint}
