apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: routed-carrier-endpoint
spec:
  devices:
    requests:
      - name: endpoint
        exactly:
          deviceClassName: carrier-routed-endpoint.dra.anchordra.co
    config:
      - requests: [endpoint]
        opaque:
          driver: dra.anchordra.co
          parameters:
            addresses:
              - {path: path-a, ip: 198.51.100.10/32}
              - {path: path-b, ip: 198.51.100.11/32}
