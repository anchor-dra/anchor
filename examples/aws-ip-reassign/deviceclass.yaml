apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: carrier-endpoint.dra.anchordra.co
spec:
  selectors:
    - cel:
        expression: >-
          device.driver == "dra.anchordra.co" &&
          device.attributes["dra.anchordra.co"].profile == "carrier-dual"
  config:
    - opaque:
        driver: dra.anchordra.co
        parameters:
          strategy: ip-reassign
          profile: carrier-dual
          slotsPerNode: 1
          paths:
            - name: path-a
              subnetId: subnet-aaaaaaaaaaaaaaaaa
              gateway: 10.50.1.1
              routes:
                - 10.50.2.20/32
              eniTagSelector:
                carrier-endpoint: "true"
                carrier-path: a
            - name: path-b
              subnetId: subnet-bbbbbbbbbbbbbbbbb
              gateway: 10.50.2.1
              routes:
                - 10.50.1.20/32
              eniTagSelector:
                carrier-endpoint: "true"
                carrier-path: b
