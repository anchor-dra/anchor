{{- if and .Values.aws.useInstanceProfile .Values.aws.credentialsSecretName }}
{{- fail "aws.useInstanceProfile and aws.credentialsSecretName are mutually exclusive" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anchor.fullname" . }}-controller
  labels:
    {{- include "anchor.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "anchor.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "anchor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "anchor.fullname" . }}-controller
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "anchor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --platform={{ .Values.platform }}
            {{- if eq .Values.platform "aws" }}
            - --aws-region={{ required "aws.region is required for the AWS platform" .Values.aws.region }}
            - --aws-enabled-strategies={{ join "," .Values.aws.enabledStrategies }}
            - --aws-advertised-strategies={{ join "," .Values.aws.advertisedStrategies }}
            - --aws-route-table-tag-key={{ required "aws.routeRepoint.managedRouteTableTag.key is required" .Values.aws.routeRepoint.managedRouteTableTag.key }}
            - --aws-route-table-tag-value={{ required "aws.routeRepoint.managedRouteTableTag.value is required" .Values.aws.routeRepoint.managedRouteTableTag.value }}
            {{- end }}
            - --aws-api-qps={{ .Values.aws.apiQPS }}
            - --aws-api-burst={{ .Values.aws.apiBurst }}
            - --reconcile-interval={{ .Values.controller.reconcileInterval }}
            - --inventory-interval={{ .Values.controller.inventoryInterval }}
            - --drift-interval={{ .Values.controller.driftInterval }}
            - --readiness-interval={{ .Values.controller.readinessInterval }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if eq .Values.platform "aws" }}
            - name: AWS_EC2_METADATA_DISABLED
              value: {{ ternary "false" "true" .Values.aws.useInstanceProfile | quote }}
            {{- end }}
          {{- with .Values.aws.credentialsSecretName }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
