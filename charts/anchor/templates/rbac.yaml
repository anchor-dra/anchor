apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "anchor.fullname" . }}-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses", "resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["anchor.dra.example.com"]
    resources: ["anchornodeinventories", "endpointplacements"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["anchor.dra.example.com"]
    resources: ["endpointplacements/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "anchor.fullname" . }}-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "anchor.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "anchor.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "anchor.fullname" . }}-node
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["anchor.dra.example.com"]
    resources: ["anchornodeinventories"]
    verbs: ["get"]
  - apiGroups: ["anchor.dra.example.com"]
    resources: ["anchornodeinventories/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["anchor.dra.example.com"]
    resources: ["endpointplacements"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "anchor.fullname" . }}-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "anchor.fullname" . }}-node
subjects:
  - kind: ServiceAccount
    name: {{ include "anchor.fullname" . }}-node
    namespace: {{ .Release.Namespace }}
