apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: endpointownerships.dra.anchordra.co
spec:
  group: dra.anchordra.co
  scope: Cluster
  names:
    plural: endpointownerships
    singular: endpointownership
    kind: EndpointOwnership
    shortNames: [eo]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Address
          type: string
          jsonPath: .spec.address
        - name: Namespace
          type: string
          jsonPath: .spec.claimNamespace
        - name: Claim
          type: string
          jsonPath: .spec.claimName
        - name: ENI
          type: string
          jsonPath: .status.eniId
        - name: Node
          type: string
          jsonPath: .status.nodeName
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [address, claimNamespace, claimName]
              properties:
                address:
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: address is immutable
                claimNamespace:
                  type: string
                claimName:
                  type: string
            status:
              type: object
              properties:
                claimUID:
                  type: string
                pathName:
                  type: string
                eniId:
                  type: string
                nodeName:
                  type: string
                lastPlacedAt:
                  type: string
                  format: date-time
