image:
  repository: ghcr.io/anchor-dra/anchor
  # Defaults to the chart appVersion. Override only for development builds.
  tag: ""
  pullPolicy: IfNotPresent

aws:
  region: ""
  useInstanceProfile: false
  credentialsSecretName: ""
  apiQPS: 2
  apiBurst: 2

controller:
  replicas: 2
  reconcileInterval: 2s
  nodeSelector: {}
  tolerations: []
  serviceAccount:
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 128Mi

node:
  selector:
    dra.anchordra.co/enabled: "true"
  preparationTimeout: 45s
  refreshInterval: 2s
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 64Mi

nameOverride: ""
fullnameOverride: ""
