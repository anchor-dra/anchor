name: CI and release

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select validation mode
        id: mode
        env:
          PROMOTION: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: echo "promotion=$PROMOTION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.mode.outputs.promotion == 'true'
      - name: Verify tested RC for main promotion
        if: steps.mode.outputs.promotion == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-promotion.py
      - name: Find successful PR validation for the merged tree
        id: pr-validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr-validation.py reuse
      - uses: actions/setup-go@v5
        if: steps.mode.outputs.promotion != 'true' && steps.pr-validation.outputs.reuse != 'true'
        with:
          go-version-file: go.mod
          cache: true
          # Rotate the old cache that omitted check.sh's custom GOCACHE.
          cache-dependency-path: |
            go.sum
            scripts/check.sh
      - uses: azure/setup-helm@v4
        if: steps.mode.outputs.promotion != 'true' && steps.pr-validation.outputs.reuse != 'true'
        with:
          version: v3.17.3
      - uses: hashicorp/setup-terraform@v3
        if: steps.mode.outputs.promotion != 'true' && steps.pr-validation.outputs.reuse != 'true'
        with:
          terraform_version: 1.11.4
      - name: Configure Terraform provider cache
        if: steps.mode.outputs.promotion != 'true' && steps.pr-validation.outputs.reuse != 'true'
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: steps.mode.outputs.promotion != 'true' && steps.pr-validation.outputs.reuse != 'true'
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-${{ runner.arch }}-terraform-1.11.4-${{ hashFiles('hack/e2e/aws/.terraform.lock.hcl') }}
      - if: steps.mode.outputs.promotion != 'true' && steps.pr-validation.outputs.reuse != 'true'
        run: terraform -chdir=hack/e2e/aws init -backend=false -lockfile=readonly
      - if: steps.mode.outputs.promotion != 'true' && steps.pr-validation.outputs.reuse != 'true'
        run: ./scripts/check.sh
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request' && steps.mode.outputs.promotion != 'true'
      - name: Verify image build
        if: github.event_name == 'pull_request' && steps.mode.outputs.promotion != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=ci
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
      - name: Record successful PR validation
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: python3 scripts/pr-validation.py record
      - name: Upload validation evidence
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-evidence
          path: .work/pr-validation.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error


  release:
    name: Publish semantic release
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          metadata_version=$(awk '
            /^metadata:$/ { in_metadata=1; next }
            in_metadata && /^  version:/ { print $2; exit }
          ' release.yaml)
          chart_version=$(awk '$1 == "version:" { print $2; exit }' charts/anchor/Chart.yaml)
          app_version=$(awk '$1 == "appVersion:" { print $2; exit }' charts/anchor/Chart.yaml)

          if [[ -z "$metadata_version" || "$metadata_version" != "$chart_version" || "$metadata_version" != "$app_version" ]]; then
            echo "release.yaml metadata.version, chart version, and appVersion must match" >&2
            exit 1
          fi

          latest_stable=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n1 || true)

          if [[ "$GITHUB_REF_NAME" == develop ]]; then
            previous_tag="$latest_stable"
            prerelease="true"
            channel_tag="rc-latest"

            if [[ -z "$latest_stable" ]]; then
              base_version="$metadata_version"
              echo "No stable tag exists; bootstrapping v$base_version from release metadata"
            else
              git log "$latest_stable"..HEAD --format='%s' > /tmp/anchor-subjects
              git log "$latest_stable"..HEAD --format='%b' > /tmp/anchor-bodies

              bump=""
              if grep -Eq '^[[:alnum:]_-]+(\([^)]*\))?!:' /tmp/anchor-subjects \
                || grep -Eq '^BREAKING CHANGE:' /tmp/anchor-bodies; then
                bump="major"
              elif grep -Eq '^feat(\([^)]*\))?:' /tmp/anchor-subjects; then
                bump="minor"
              elif grep -Eq '^(fix|perf)(\([^)]*\))?:' /tmp/anchor-subjects; then
                bump="patch"
              fi

              if [[ -z "$bump" ]]; then
                echo "No releasable conventional commit since $latest_stable"
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              stable_version=${latest_stable#v}
              IFS=. read -r major minor patch <<< "$stable_version"
              case "$bump" in
                major) base_version="$((major + 1)).0.0" ;;
                minor) base_version="$major.$((minor + 1)).0" ;;
                patch) base_version="$major.$minor.$((patch + 1))" ;;
              esac
            fi

            latest_rc=$(git tag --list "v${base_version}-rc.*" --sort=-v:refname | head -n1 || true)
            if [[ -n "$latest_rc" && "$(git rev-list -n1 "$latest_rc")" == "$GITHUB_SHA" ]]; then
              echo "$latest_rc already points to this commit; nothing to publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ -n "$latest_rc" ]]; then
              rc_number=${latest_rc##*.}
              rc_number=$((rc_number + 1))
            else
              rc_number=1
            fi
            version="${base_version}-rc.${rc_number}"
            tag="v$version"
          elif [[ "$GITHUB_REF_NAME" == main ]]; then
            prerelease="false"
            channel_tag="latest"
            matching_rc=""
            while IFS= read -r candidate; do
              if git diff --quiet "$candidate^{tree}" "HEAD^{tree}"; then
                matching_rc="$candidate"
                break
              fi
            done < <(git tag --list 'v*-rc.*' --sort=-v:refname)

            if [[ -z "$matching_rc" ]]; then
              echo "main must exactly match a tested develop RC before a stable release" >&2
              exit 1
            fi

            version=${matching_rc#v}
            version=${version%-rc.*}
            tag="v$version"
            previous_tag="$latest_stable"
          else
            echo "Unsupported release branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "publish=true"
            echo "version=$version"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
            echo "prerelease=$prerelease"
            echo "channel_tag=$channel_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - uses: azure/setup-helm@v4
        if: steps.version.outputs.publish == 'true'
        with:
          version: v3.17.3

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.publish == 'true'

      - uses: docker/login-action@v3
        if: steps.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.channel_tag }}
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Package and publish Helm chart
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          helm package charts/anchor \
            --destination dist \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm push "dist/anchor-$VERSION.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Prepare release metadata
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            !updated && /^  version:/ {
              print "  version: " version
              updated=1
              next
            }
            { print }
          ' release.yaml > dist/release.yaml
          (cd dist && sha256sum "anchor-$VERSION.tgz" release.yaml > SHA256SUMS)

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          notes_args=(--generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          if [[ "$PRERELEASE" == true ]]; then
            notes_args+=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Anchor DRA $TAG" \
            "${notes_args[@]}" \
            "dist/anchor-$VERSION.tgz" \
            dist/release.yaml \
            dist/SHA256SUMS
