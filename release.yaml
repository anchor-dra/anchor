apiVersion: anchor.dra.example.com/v1alpha1
kind: AnchorRelease
metadata:
  version: 0.1.0
spec:
  kubernetes:
    minimumVersion: 1.34.0
    testedVersion: 1.34.7
  delivery:
    architecture: amd64
  networking:
    multusVersion: 4.2.2
    requiredCNIPlugins:
      - ipvlan
      - static
      - sbr
  placementStrategies:
    - ip-reassign
  dependencies:
    go: 1.24.0
    awsSDKGoV2: 1.36.3
