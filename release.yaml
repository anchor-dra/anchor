apiVersion: dra.anchordra.co/v1alpha1
kind: AnchorRelease
metadata:
  name: anchor-dra
  version: 0.1.0
spec:
  identity:
    project: Anchor DRA
    githubProject: anchor-dra
    repository: anchor
    goModule: github.com/anchor-dra/anchor
    domain: anchordra.co
    apiGroup: dra.anchordra.co
    driver: dra.anchordra.co
  kubernetes:
    minimumVersion: 1.34.0
    testedVersion: 1.35.4
  delivery:
    architecture: amd64
  networking:
    multusVersion: 4.2.2
    requiredCNIPlugins:
      - ipvlan
      - static
      - sbr
  placementStrategies:
    - ip-reassign
  dependencies:
    go: 1.24.0
    awsSDKGoV2: 1.36.3
