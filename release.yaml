apiVersion: dra.anchordra.co/v1alpha1
kind: AnchorRelease
metadata:
  name: anchor-dra
  version: 0.2.1
spec:
  identity:
    project: Anchor DRA
    githubProject: anchor-dra
    repository: anchor
    goModule: github.com/anchor-dra/anchor
    domain: anchordra.co
    apiGroup: dra.anchordra.co
    driver: dra.anchordra.co
  kubernetes:
    minimumVersion: 1.34.0
    testedVersion: 1.35.4
  delivery:
    architecture: amd64
  networking:
    injector: nri-ipvlan
    nriVersion: 0.12.2
    runtime: containerd
    testedRuntimeVersion: 2.2.6
    requiredRuntimeFix: https://github.com/containerd/containerd/pull/13399
    runtimeSelection:
      runPodSandboxMinimumVersion: 2.2.6
      fallbackHook: CreateContainer
      lateRegistrationGuard: CreateContainer
    requiredPlugin: anchor
  placementStrategies:
    - ip-reassign
    - l2-announce
  dependencies:
    go: 1.24.0
    awsSDKGoV2: 1.36.3
